version: '3.8'

services:
  bff:
    build:
      context: ./BFF
      dockerfile: Dockerfile
    ports:
      - "9595:9595"
    environment:
      - PORT=9595
      # Configures the BFF to query WordPress / SQL backend via the host gateway (host.docker.internal)
      # if it is running directly on the machine/VPS instead of a container.
      - WP_GRAPHQL_URL=http://host.docker.internal:8080/graphql
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # Client-side requests in the browser will query the BFF via localhost
      - NEXT_PUBLIC_API_URL=http://localhost:9595/bff/api
    depends_on:
      - bff
    restart: always
