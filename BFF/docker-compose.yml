version: '3.8'

services:
  bff:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9595:9595"
    environment:
      - PORT=9595
      # Configures the BFF to query WordPress / SQL backend via the host gateway (host.docker.internal)
      # if it is running directly on the machine/VPS instead of a container.
      - WP_GRAPHQL_URL=http://host.docker.internal:8080/graphql
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always